[workspace]
resolver = "2"
members = [
  "crates/envryn-core",
  "crates/envryn-ai-worker",
  "crates/envryn-android-clipboard",
  "src-tauri",
]

[workspace.package]
# MSI/WiX requires a numeric-only version (confirmed by a real failed build:
# "0.1.0-beta" produces `optional pre-release identifier in app version must
# be numeric-only ... for msi target`) -- the beta designation lives in the
# git tag (v0.1.0-beta) and the GitHub release name instead, not here.
version = "0.1.9"
edition = "2021"
# Bumped from 1.82 for ts-rs 12's MSRV (1.88) -- see the contract-generation
# entry below. This is an application (`publish = false` everywhere), not a
# library other crates depend on, so tracking the toolchain this closely
# costs nothing real; CI already always builds on latest stable.
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
# --- Cryptography -----------------------------------------------------------
# One implementation per primitive. See docs/CRYPTOGRAPHY.md; adding another
# requires amending docs/DEPENDENCY_POLICY.md.
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
getrandom = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }

# --- Storage ----------------------------------------------------------------
rusqlite = { version = "0.32", features = ["bundled", "uuid"] }
uuid = { version = "1.11", features = ["v7", "serde"] }

# --- Serialisation ----------------------------------------------------------
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Errors / misc ----------------------------------------------------------
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

# --- IPC contract generation --------------------------------------------------
# Generates packages/contract/bindings/*.ts from the real Rust types
# (`.cargo/config.toml` sets TS_RS_EXPORT_DIR so every workspace member
# exports to the same place regardless of its own depth from the repo root).
# `uuid-impl` is needed for `SecretId` (a transparent wrapper around `Uuid`).
ts-rs = { version = "12.0", features = ["uuid-impl"] }

[profile.release]
# A vault should not leak its own source structure in a shipped binary.
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
# Argon2id at production parameters is unusably slow in a debug build
# (minutes, not milliseconds). Optimise dependencies even in dev so that
# unlock timing during development resembles reality.
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
