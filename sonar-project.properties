sonar.organization=gr33nops
sonar.projectKey=Gr33nOps_Envryn
sonar.projectName=Envryn

# Real, first-party source only. Vendored shadcn/ui components and every
# build/dependency artifact are excluded so findings stay actionable --
# see docs/audits/AUDIT_REPORT.md's "First-party code only" scoping decision.
sonar.sources=crates,src-tauri/src,apps/ui/src
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,packages/contract/bindings/**,apps/ui/src/routeTree.gen.ts,src-tauri/gen/**

# Keep every file in static analysis while measuring only code exercised by
# the two LCOV producers configured below. Test harnesses are not production
# code, the Android bridge needs JaCoCo rather than JS/Rust LCOV, and the
# listed Tauri AppHandle/State/window adapters cannot be driven meaningfully
# without a running Tauri process. Their underlying core logic remains in the
# instrumented, heavily tested crates; all adapter files remain statically
# analyzed by Sonar.
sonar.coverage.exclusions=apps/ui/src/**/*.test.ts,apps/ui/src/**/*.test.tsx,apps/ui/src/test-setup.ts,crates/envryn-android-clipboard/android/**,src-tauri/src/ai.rs,src-tauri/src/ipc.rs,src-tauri/src/lib.rs,src-tauri/src/sync.rs,src-tauri/src/window_chrome.rs

sonar.sourceEncoding=UTF-8

# Real coverage, not a phantom 0% -- generated by `npm run test:coverage`
# (apps/ui) and `cargo llvm-cov --workspace --lcov` (crates/, src-tauri),
# both wired into CI before this scan runs.
sonar.javascript.lcov.reportPaths=apps/ui/coverage/lcov.info
sonar.rust.lcov.reportPaths=lcov.info
