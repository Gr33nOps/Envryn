name: Release build

# Manual-only, on purpose: this workflow builds installer artifacts and uploads them as a
# workflow run artifact for review -- it does not publish a GitHub Release (that stays a
# deliberate, separate, human action) and it never runs on a push or pull_request, so a PR
# (including a fork PR, once this repo has outside contributors) cannot trigger a build on the
# self-hosted runner just by existing. See RELEASE_SIGNING.md for the code-signing plan this
# leaves a slot for, and SECURITY_REMEDIATION_REPORT.md/ci.yml's own comments for why this repo
# runs on a repository-scoped self-hosted Windows runner rather than paid GitHub-hosted ones.

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build MSI + NSIS installers
    runs-on: [self-hosted, envryn-self-hosted]
    # Same reasoning as ci.yml's rust job: this runner is the maintainer's own desktop, not a
    # dedicated CI box, and this build compiles the full workspace including candle/tokenizers
    # for the real (non-placeholder) AI-worker sidecar on top of the main app -- genuinely more
    # memory pressure than ci.yml's job, which only compiles a placeholder sidecar. Capped
    # further here for that reason; observed directly this same session: an 8 GiB fixed pagefile
    # plus ordinary desktop load (browser, Photoshop, WSL) produced a real "paging file is too
    # small" failure compiling a similarly-sized dependency tree at default parallelism.
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build --workspace @envryn/ui

      # Builds the real AI-worker sidecar -- not the placeholder ci.yml uses, since this
      # workflow's whole point is producing real, distributable artifacts.
      - run: npm run prepare:sidecar

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # --- Code signing goes here once RELEASE_SIGNING.md's plan is actually executed. ---
      # Nothing below is active: no secret it references exists yet, so there is nothing to
      # leak and nothing that can silently start signing with an unintended identity. Adding
      # real signing means uncommenting this block and creating the two secrets named below --
      # not restructuring this workflow or tauri.conf.json's shape (see RELEASE_SIGNING.md §4-5).
      #
      # - name: Import code-signing credential
      #   env:
      #     WINDOWS_SIGN_SECRET: ${{ secrets.WINDOWS_SIGN_SECRET }}
      #   run: |
      #     # e.g. az login with a service principal scoped only to Trusted Signing, or
      #     # Import-PfxCertificate for a token-backed cert -- whichever RELEASE_SIGNING.md's
      #     # eventual choice needs. Left unimplemented deliberately: no cert exists to test
      #     # this against yet, and a guessed implementation is worse than an honest gap.
      #
      # - name: cargo tauri build (signed)
      #   run: |
      #     cargo tauri build --config '{"bundle":{"windows":{"digestAlgorithm":"sha256","signCommand":"..."}}}'

      - name: cargo tauri build
        run: cargo tauri build

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/msi/*.msi, target/release/bundle/nsis/*.exe |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($hash.Hash)  $($_.Name)"
            } | Tee-Object -FilePath target/release/bundle/SHA256SUMS.txt

      - name: Upload installers as a workflow artifact (not a GitHub Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: envryn-windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/SHA256SUMS.txt
          retention-days: 14
