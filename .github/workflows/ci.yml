name: CI

# The checks below were, until now, run manually before each phase's commit
# (see docs/ARCHITECTURE.md section 9 and every phase commit's own
# "Verified" paragraph). This workflow is the first time any of them run
# automatically. It intentionally mirrors those manual commands exactly
# rather than inventing a different CI-only check, so "passes locally" and
# "passes in CI" mean the same thing.
#
# Rust jobs run on Windows deliberately, not Linux: Envryn is a Windows-only
# build (docs/ARCHITECTURE.md section 7), and most of what changed in the
# sync/AI/hardening passes lives behind `#[cfg(windows)]` (DPAPI, clipboard
# exclusion, screen-capture exclusion, the Job Object AI worker isolation,
# the WTS_SESSION_LOCK hook, Windows Hello). Building on Linux would
# silently compile the `stub` fallbacks instead and test none of that real
# platform code.
#
# Rust runs on GitHub-hosted Windows so the actual Windows-only code paths
# are compiled and tested. The platform-neutral frontend and Semgrep jobs
# run on hosted Linux. GitHub-hosted Actions are free for this public repo,
# and avoiding a maintainer workstation as a runner keeps CI available and
# prevents untrusted pull-request code from executing on a personal device.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A superseded run (an older commit on the same branch, once a newer one has
# been pushed) is cancelled rather than left to finish -- discovered costing
# real time and runner minutes for nothing when several commits landed in
# quick succession during this workflow's own rollout: three separate ~15+
# minute Rust jobs queued and ran to completion validating commits that were
# already obsolete the moment the next one was pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test, deny, audit)
    runs-on: windows-latest
    # Keep memory use predictable while compiling the heavier Tauri and AI
    # dependency trees without weakening any checks.
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      # tauri::generate_context!() reads tauri.conf.json at compile time and
      # requires the frontendDist path to physically exist -- discovered by
      # this exact workflow failing with "proc macro panicked... this path
      # doesn't exist" the first time it ran, since the frontend was only
      # built in the separate `frontend` job below, whose output this job
      # never sees. Needed even for clippy, not only a real build.
      - run: npm run build --workspace @envryn/ui

      # tauri_build::build() (src-tauri/build.rs) also resolves every
      # `bundle.externalBin` resource path at compile time -- not only when
      # actually bundling -- and fails the build outright ("resource path
      # ... doesn't exist") if it is missing. `src-tauri/binaries/` is
      # deliberately .gitignore'd (a real compiled sidecar binary has no
      # business in version control), and building a real one here would
      # mean compiling envryn-ai-worker's full candle/tokenizers dependency
      # tree a second time in this job alone, in release mode, on top of
      # `cargo test` already doing it in dev mode -- discovered costing real
      # CI time the first time `bundle.externalBin` was added, when this
      # step didn't exist and clippy failed here instead. A placeholder
      # satisfies the existence check without paying that cost: none of
      # fmt/clippy/test/deny/audit ever execute the sidecar, only compile
      # against its declared path.
      - name: Placeholder AI worker sidecar (never executed by this job)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Set-Content -Path src-tauri/binaries/envryn-ai-worker-x86_64-pc-windows-msvc.exe -Value "placeholder"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # `cargo test` above just regenerated every packages/contract/bindings/*.ts
      # file from the current Rust types (ts-rs's export_bindings_* tests run
      # as part of the normal suite, not a separate step) -- if that produced
      # a diff, someone changed a Rust IPC type and forgot to regenerate and
      # commit the bindings, which is exactly the drift this generation exists
      # to prevent. Fails loudly instead of letting a stale contract merge.
      - name: contract bindings are up to date
        run: git diff --exit-code -- packages/contract/bindings

      - name: cargo deny check
        # Not the EmbarkStudios/cargo-deny-action marketplace action: it is
        # a Docker container action, and GitHub Actions only supports
        # container actions on Linux runners -- it fails outright here with
        # "Container action is only supported on Linux", discovered by
        # actually running this workflow rather than assumed to work.
        # Installing the native binary works identically cross-platform.
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: security configuration invariants
        run: npm run test:security-invariants

      - name: Install checksum-verified security scanners
        shell: pwsh
        run: |
          $toolsDir = Join-Path $env:RUNNER_TEMP "envryn-security-tools"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null

          $gitleaksZip = Join-Path $toolsDir "gitleaks.zip"
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip" -OutFile $gitleaksZip
          if ((Get-FileHash -Algorithm SHA256 $gitleaksZip).Hash.ToLower() -ne "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e") {
            throw "Gitleaks download checksum mismatch"
          }
          Expand-Archive -LiteralPath $gitleaksZip -DestinationPath $toolsDir -Force

          $osvPath = Join-Path $toolsDir "osv-scanner.exe"
          Invoke-WebRequest -Uri "https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_windows_amd64.exe" -OutFile $osvPath
          if ((Get-FileHash -Algorithm SHA256 $osvPath).Hash.ToLower() -ne "25e42f5ef6711fd8c0fb45390972205891dd44c6bd02ac93f0f63e8e98d9bfb6") {
            throw "OSV-Scanner download checksum mismatch"
          }

          $toolsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: secret scan
        run: gitleaks git --config .gitleaks.toml --redact --no-banner

      - name: OSV dependency scan
        run: ./.dev-tools/osv-source-scan.ps1

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: "pip install --only-binary=:all: semgrep==1.175.0"

      - run: semgrep --config .semgrep/ crates/ src-tauri/ apps/ui/src --error

  frontend:
    name: Frontend (lint, typecheck, unit test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:docs

      - run: npm run test:coverage --workspace @envryn/ui

      - run: npm run build

      - run: npm run test:bundle-budget

  browser-e2e:
    name: Browser E2E (desktop, mobile, accessibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        # Execute the dependency installed and integrity-checked by npm ci.
        # npx may download an unpinned package when the local binary is absent.
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
