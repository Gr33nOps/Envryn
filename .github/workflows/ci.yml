name: CI

# The checks below were, until now, run manually before each phase's commit
# (see docs/ARCHITECTURE.md section 9 and every phase commit's own
# "Verified" paragraph). This workflow is the first time any of them run
# automatically. It intentionally mirrors those manual commands exactly
# rather than inventing a different CI-only check, so "passes locally" and
# "passes in CI" mean the same thing.
#
# Rust jobs run on windows-latest deliberately, not ubuntu-latest: Envryn is
# a Windows-only build (docs/ARCHITECTURE.md section 7), and most of what
# changed in the sync/AI/hardening passes lives behind `#[cfg(windows)]`
# (DPAPI, clipboard exclusion, screen-capture exclusion, the Job Object AI
# worker isolation, the WTS_SESSION_LOCK hook, Windows Hello). Building on
# Linux would silently compile the `stub` fallbacks instead and test none of
# that real platform code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run (an older commit on the same branch, once a newer one has
# been pushed) is cancelled rather than left to finish -- discovered costing
# real time and runner minutes for nothing when several commits landed in
# quick succession during this workflow's own rollout: three separate ~15+
# minute Rust jobs queued and ran to completion validating commits that were
# already obsolete the moment the next one was pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test, deny, audit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # tauri::generate_context!() reads tauri.conf.json at compile time and
      # requires the frontendDist path to physically exist -- discovered by
      # this exact workflow failing with "proc macro panicked... this path
      # doesn't exist" the first time it ran, since the frontend was only
      # built in the separate `frontend` job below, whose output this job
      # never sees. Needed even for clippy, not only a real build.
      - run: npm run build --workspace @envryn/ui

      # tauri_build::build() (src-tauri/build.rs) also resolves every
      # `bundle.externalBin` resource path at compile time -- not only when
      # actually bundling -- and fails the build outright ("resource path
      # ... doesn't exist") if it is missing. `src-tauri/binaries/` is
      # deliberately .gitignore'd (a real compiled sidecar binary has no
      # business in version control), and building a real one here would
      # mean compiling envryn-ai-worker's full candle/tokenizers dependency
      # tree a second time in this job alone, in release mode, on top of
      # `cargo test` already doing it in dev mode -- discovered costing real
      # CI time the first time `bundle.externalBin` was added, when this
      # step didn't exist and clippy failed here instead. A placeholder
      # satisfies the existence check without paying that cost: none of
      # fmt/clippy/test/deny/audit ever execute the sidecar, only compile
      # against its declared path.
      - name: Placeholder AI worker sidecar (never executed by this job)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Set-Content -Path src-tauri/binaries/envryn-ai-worker-x86_64-pc-windows-msvc.exe -Value "placeholder"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # `cargo test` above just regenerated every packages/contract/bindings/*.ts
      # file from the current Rust types (ts-rs's export_bindings_* tests run
      # as part of the normal suite, not a separate step) -- if that produced
      # a diff, someone changed a Rust IPC type and forgot to regenerate and
      # commit the bindings, which is exactly the drift this generation exists
      # to prevent. Fails loudly instead of letting a stale contract merge.
      - name: contract bindings are up to date
        run: git diff --exit-code -- packages/contract/bindings

      - name: cargo deny check
        # Not the EmbarkStudios/cargo-deny-action marketplace action: it is
        # a Docker container action, and GitHub Actions only supports
        # container actions on Linux runners -- it fails outright here with
        # "Container action is only supported on Linux", discovered by
        # actually running this workflow rather than assumed to work.
        # Installing the native binary works identically cross-platform.
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - run: pip install semgrep

      - run: semgrep --config .semgrep/ crates/ src-tauri/ apps/ui/src --error

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build
