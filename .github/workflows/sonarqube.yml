name: SonarQube

# Split out of ci.yml deliberately: this job needs windows-latest for the
# same #[cfg(windows)] reason ci.yml's Rust job does (see that file's top
# comment), which means running it on every push doubled Windows-runner
# minute consumption for a report-only analysis that doesn't need to be
# that fresh -- a real contributor to this repo hitting a GitHub Actions
# startup_failure (zero jobs, zero billable minutes -- consistent with an
# exhausted minutes quota) shortly after this job was added to ci.yml.
# Weekly + on-demand is a normal cadence for code-quality scanning; every
# commit is not required for it to be useful.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube (crates/, src-tauri/src, apps/ui/src)
    # windows-latest, not ubuntu-latest: most of envryn-core's platform code
    # is #[cfg(windows)] -- generating coverage on Linux would compile the
    # untested `stub.rs` fallbacks instead and report a materially wrong
    # (lower) number. See ci.yml's Rust job for the same reasoning.
    runs-on: windows-latest
    # Report-only: this surfaces new findings on the SonarCloud dashboard
    # without blocking merges on Envryn's 100+ pre-existing code-quality
    # findings (see docs/audits/AUDIT_REPORT.md) -- turning it into a hard gate is a
    # separate, deliberate decision, not a side effect of wiring this up.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not a shallow clone -- SonarQube's SCM sensor
          # blames each line to a real commit/author, which a depth-1
          # checkout cannot provide.
          fetch-depth: 0

      # The GitHub App decorates commits from the repository-bound project.
      # Print only actionable issue metadata (never the token) so a private
      # SonarCloud project can still be diagnosed from its Actions run.
      - name: Inspect repository-bound SonarCloud security issues
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $credential = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("$($env:SONAR_TOKEN):")
          )
          $headers = @{ Authorization = "Basic $credential" }
          $params = @{
            componentKeys = "Gr33nOps_local-vault-for-devs"
            branch = "main"
            resolved = "false"
            impactSoftwareQualities = "SECURITY"
            ps = "100"
          }
          $query = ($params.GetEnumerator() | ForEach-Object {
            "$([Uri]::EscapeDataString($_.Key))=$([Uri]::EscapeDataString($_.Value))"
          }) -join "&"
          $request = @{
            Uri = "https://sonarcloud.io/api/issues/search?$query"
            Headers = $headers
          }
          $result = Invoke-RestMethod @request

          Write-Output "Open security issues: $($result.total)"
          $result.issues | ForEach-Object {
            $description = "{0} | {1} | {2}:{3} | {4}" -f @(
              $_.key, $_.rule, $_.component, $_.line, $_.message
            )
            Write-Output $description
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      # Real per-file coverage for apps/ui, not a stand-in -- consumed below
      # via sonar.javascript.lcov.reportPaths (sonar-project.properties).
      - run: npm run test:coverage --workspace @envryn/ui

      # tauri::generate_context!() reads tauri.conf.json at compile time and
      # requires frontendDist to physically exist -- same requirement as
      # ci.yml's Rust job; test:coverage runs vitest, not vite build, so
      # dist/ still needs to be produced separately.
      - run: npm run build --workspace @envryn/ui

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      # tauri::generate_context!() requires the configured external binary to
      # exist while src-tauri compiles. Use a real minimal PE executable here:
      # a text file with an .exe suffix is copied into Cargo's target directory
      # by Tauri and then makes llvm-cov abort while inspecting object files.
      - name: Build placeholder AI worker sidecar (never executed by this job)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          $source = Join-Path $env:RUNNER_TEMP "envryn-ai-worker-placeholder.rs"
          Set-Content -Path $source -Value "fn main() {}"
          rustc $source -o src-tauri/binaries/envryn-ai-worker-x86_64-pc-windows-msvc.exe

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: cargo install cargo-llvm-cov --locked

      # Real per-file coverage for crates/ and src-tauri/src -- consumed
      # below via sonar.rust.lcov.reportPaths.
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
