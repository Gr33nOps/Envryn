changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security and privacy
      labels:
        - security
        - privacy
    - title: New features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - dependencies
        - maintenance
    - title: Other changes
      labels:
        - "*"
