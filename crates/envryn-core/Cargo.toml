[package]
name = "envryn-core"
description = "Envryn vault core: cryptography, storage, and vault state. No UI, no Tauri, no network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
argon2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
hmac.workspace = true
zeroize.workspace = true
subtle.workspace = true
getrandom.workspace = true
rand_core.workspace = true

rusqlite.workspace = true
uuid.workspace = true

serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
time.workspace = true

[target.'cfg(windows)'.dependencies]
# Version left unpinned to the patch: Tauri itself depends on `windows = "0.61"`
# with an overlapping feature set, and Cargo unifies both to one crate instance
# so that the HWND we receive from Tauri and the HWND type here are identical.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.14"

[lints.rust]
# Win32 FFI in platform::windows_impl is the one place in this crate that
# needs unsafe. "deny" (not "forbid") so that module can carry a scoped
# #[allow(unsafe_code)] -- forbid cannot be overridden by any allow, which
# would make the exemption impossible to express. Every other module remains
# unsafe-free, and that boundary is exactly what this lint level protects.
unsafe_code = "deny"

[lints.clippy]
# A silent panic in a vault is a denial of the user's own data.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
