[package]
name = "envryn-core"
description = "Envryn vault core: cryptography, storage, and vault state. No UI, no Tauri, no network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
argon2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
hmac.workspace = true
zeroize.workspace = true
subtle.workspace = true
getrandom.workspace = true
rand_core.workspace = true

rusqlite.workspace = true
uuid.workspace = true

serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
time.workspace = true

[dev-dependencies]
tempfile = "3.14"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# A silent panic in a vault is a denial of the user's own data.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
