[package]
name = "envryn-core"
description = "Envryn vault core: cryptography, storage, vault state, and LAN sync. No UI, no Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
# Test-only fixture for src/ai/worker_client.rs -- see the fixture's own doc
# comment. Built for every `cargo build`, same as any bin target; the cost is
# a few KB and a std-only compile, which is cheap enough not to warrant the
# complexity of excluding it from non-test builds.
name = "fake-ai-worker-fixture"
path = "tests/fixtures/fake_worker_main.rs"

[dependencies]
argon2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
hmac.workspace = true
zeroize.workspace = true
subtle.workspace = true
getrandom.workspace = true
rand_core.workspace = true
rand = "0.8"

rusqlite.workspace = true
uuid.workspace = true

serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
time.workspace = true

# --- sync/: the one deliberate exception to "no network" (INV-010 permits
# LAN sync with an already-paired device). Nothing outside crate::sync may
# import these -- see docs/DEPENDENCY_POLICY.md.
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
spake2 = "0.4"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
# For extracting the SubjectPublicKeyInfo from a peer's presented certificate
# during the TLS handshake, so it can be hashed and checked against
# trusted_devices. Chosen over hand-parsing DER, and over RFC 7250 raw public
# keys (which rustls supports but far less commonly, with much less
# real-world usage to draw on) -- self-signed X.509 plus SPKI fingerprint
# pinning is the well-trodden pattern here, and getting this parsing wrong is
# not a place to economise.
x509-parser = "0.18"
tokio = { version = "1", features = ["net", "rt", "io-util", "time", "sync"] }
mdns-sd = "0.13"

# ai/model_download.rs: the one other deliberate exception to "no network"
# INV-010 permits (explicit user-initiated model download). Blocking, and on
# rustls (already a dependency above) rather than pulling in a second TLS
# stack via native-tls/openssl.
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
# Version left unpinned to the patch: Tauri itself depends on `windows = "0.61"`
# with an overlapping feature set, and Cargo unifies both to one crate instance
# so that the HWND we receive from Tauri and the HWND type here are identical.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.14"
# Compile-fail test proving `ai::gateway::SanitizedPrompt` cannot be
# constructed outside its own module -- see tests/sanitized_prompt_encapsulation.rs
# and docs/AI_SECURITY.md section 2.
trybuild = "1"

[lints.rust]
# Win32 FFI in platform::windows_impl is the one place in this crate that
# needs unsafe. "deny" (not "forbid") so that module can carry a scoped
# #[allow(unsafe_code)] -- forbid cannot be overridden by any allow, which
# would make the exemption impossible to express. Every other module remains
# unsafe-free, and that boundary is exactly what this lint level protects.
unsafe_code = "deny"

[lints.clippy]
# A silent panic in a vault is a denial of the user's own data.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
