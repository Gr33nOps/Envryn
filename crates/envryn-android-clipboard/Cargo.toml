[package]
name = "envryn-android-clipboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
links = "envryn-android-clipboard"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[lints.rust]
unsafe_code = "forbid"
