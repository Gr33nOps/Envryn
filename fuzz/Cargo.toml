[package]
name = "envryn-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zeroize = "1"

[dependencies.envryn-core]
path = "../crates/envryn-core"
features = ["fuzzing"]

[[bin]]
name = "fuzz_aead_open"
path = "fuzz_targets/fuzz_aead_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_backup_restore"
path = "fuzz_targets/fuzz_backup_restore.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_sync_wire"
path = "fuzz_targets/fuzz_sync_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_device_identity"
path = "fuzz_targets/fuzz_device_identity.rs"
test = false
doc = false
bench = false
