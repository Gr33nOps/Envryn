[package]
name = "envryn"
description = "Envryn - local-first developer secrets vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "envryn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
envryn-core = { path = "../crates/envryn-core" }

tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
thiserror.workspace = true

# Only "time" beyond what Tauri itself already pulls in (rt, rt-multi-thread,
# sync, fs, io-util) -- the auto-lock poll and the clipboard clear timer are
# the only things here that need it. Left unpinned to the patch so Cargo
# unifies with Tauri's own `tokio = "1"` requirement into one runtime instance.
tokio = { version = "1", features = ["time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
