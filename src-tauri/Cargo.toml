[package]
name = "envryn"
description = "Envryn - local-first developer secrets vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "envryn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Only to embed a Common-Controls-v6 manifest into `cargo test`'s own harness
# binary -- see build.rs for why `tauri_build::build()` alone doesn't cover it.
embed-resource = "3"

[features]
# Without this, even a `--release` build serves the webview from `devUrl`
# (localhost:1420) instead of the embedded `frontendDist` build -- discovered
# the hard way by actually running a plain `cargo build --release` binary
# standalone (via a WebDriver smoke test) and watching it try to reach a dev
# server that was not running. `default` so a plain `cargo build --release`
# behaves like a real release build without every caller needing to
# remember `--features custom-protocol` -- matching every other Tauri
# project's scaffolding, which enables this by default for exactly this
# reason.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
envryn-core = { path = "../crates/envryn-core" }

tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
thiserror.workspace = true
# Only for a human-facing 6-digit pairing code -- not used for anything
# cryptographic, so this does not need to match envryn-core's rand_core/OsRng
# discipline.
rand = "0.8"
# Same version/features as envryn-core's own dependency (crates/envryn-core/Cargo.toml)
# -- this crate only drives the `rustls::Stream`/`ServerConnection`/
# `ClientConnection` plumbing around the `rustls::ServerConfig`/`ClientConfig`
# that `envryn_core::sync::transport` builds; it never touches TLS internals.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Only "time" beyond what Tauri itself already pulls in (rt, rt-multi-thread,
# sync, fs, io-util) -- the auto-lock poll and the clipboard clear timer are
# the only things here that need it. Left unpinned to the patch so Cargo
# unifies with Tauri's own `tokio = "1"` requirement into one runtime instance.
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
# Real Tauri IPC dispatch against a `MockRuntime`, not a mock of our own --
# `assert_ipc_response`/`get_ipc_response` invoke a command by its real
# string name through the same dispatch path `generate_handler!` wires up
# for the real app, proving the actual `#[tauri::command]` functions in
# ipc.rs/sync.rs/settings.rs/ai.rs behave correctly, not just the plain Rust
# functions behind them called directly.
tauri = { version = "2", features = ["test"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
